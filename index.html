<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de stock de cave Impériale</title>
<style>
:root{--bg:#f8f3e8;--card:#fffdf8;--ink:#2a1d0e;--mute:#75654f;--line:#e6d8bb;--acc:#8a5a14;--acc2:#f1e2c0;--ok:#2f6b3a;--okbg:#e1f0dc;--bad:#a8321f;--badbg:#f9e1da;--warn:#8a5a14;--warnbg:#faecc6;--head:#2b1a0b;--headink:#fff;--stripe:#fbf6ea}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16120c;--card:#211a11;--ink:#f1ebdf;--mute:#b3a58f;--line:#3a3022;--acc:#e0b862;--acc2:#3a2c14;--ok:#6fd1b0;--okbg:#17362d;--bad:#ff9a92;--badbg:#42201f;--warn:#f2c36b;--warnbg:#3f3016;--head:#1c130a;--stripe:#1a150e}}
:root[data-theme=dark]{--bg:#16120c;--card:#211a11;--ink:#f1ebdf;--mute:#b3a58f;--line:#3a3022;--acc:#e0b862;--acc2:#3a2c14;--ok:#6fd1b0;--okbg:#17362d;--bad:#ff9a92;--badbg:#42201f;--warn:#f2c36b;--warnbg:#3f3016;--head:#1c130a;--stripe:#1a150e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--head);color:var(--headink);padding:18px 20px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 22px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.2px}
.sub{margin:4px 0 0;color:#d6c49e;font-size:13px}
#theme{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:14px;scrollbar-width:thin}
nav button{background:transparent;color:#ecdcb8;border:0;padding:10px 16px;font:inherit;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button[aria-selected=true]{background:var(--bg);color:var(--acc);font-weight:600}
nav button:focus-visible,#theme:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d9a441;outline-offset:2px}
main{padding:20px;max-width:1500px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font:600 18px/1.3 Georgia,serif;margin:26px 0 10px}
h2:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi span{display:block;color:var(--mute);font-size:13px}
.kpi b{display:block;font:600 22px/1.3 Georgia,serif;margin-top:4px}
.kpi.warn b{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px;max-width:380px}
.count{color:var(--mute);font-size:13px;margin-left:auto}
.wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--head);color:#fff;font-weight:600;cursor:pointer;user-select:none;z-index:1;white-space:normal;min-width:70px;vertical-align:bottom}
th.nosort{cursor:default}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--acc2)}
tfoot td{position:sticky;bottom:0;background:var(--acc2);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.alert td{background:var(--badbg)}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b.ok{background:var(--okbg);color:var(--ok)}.b.bad{background:var(--badbg);color:var(--bad)}.b.warn{background:var(--warnbg);color:var(--warn)}
.bars .row{display:grid;grid-template-columns:130px 1fr 110px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .track{background:var(--acc2);border-radius:5px;height:14px;overflow:hidden}
.bars .fill{background:var(--acc);height:100%;border-radius:5px}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
svg text{fill:var(--mute);font-size:10px}
.guide p{margin:2px 0}.guide h3{font:600 15px Georgia,serif;margin:18px 0 4px;color:var(--acc)}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
@media (max-width:600px){main{padding:12px}.bars .row{grid-template-columns:96px 1fr 84px}}
@media print{header nav,#theme,.tools{display:none}section{display:block!important}.wrap{max-height:none}}
#reset,#savef,#pwb,#outb{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.hb{display:flex;gap:8px}
input.ed,select.ed{background:#fff6cc;color:#1f1b24;border:1px solid #e0c968;padding:3px 6px;border-radius:5px;width:100%;min-width:78px;font:inherit;font-size:13px}
input.ed.miss{border-color:var(--bad);background:#fbe3e1}
td:has(.ed){padding:3px 5px}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
.x{background:transparent;border:0;color:var(--bad);cursor:pointer;font-size:15px}
.hint{display:inline-block;background:#fff6cc;color:#1f1b24;border:1px solid #e0c968;border-radius:5px;padding:0 8px;font-size:12px}
.lnk{background:var(--acc2);color:var(--acc);border:0;border-radius:99px;padding:5px 13px;margin:3px;cursor:pointer;font:inherit;font-weight:600}
.lnk:hover{outline:2px solid var(--acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:780px;width:94vw;padding:18px}
dialog::backdrop{background:#0008}
.btn.alt{background:var(--acc2);color:var(--acc)}
.rad{display:inline-flex;gap:6px;align-items:center;margin-right:14px}
.inv h3{margin:0;font:600 20px Georgia,serif}.inv .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;margin:10px 0}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.logo{height:58px;border-radius:8px;box-shadow:0 0 0 1px #ffffff40}
.days{display:flex;gap:5px}.days label{display:flex;flex-direction:column;align-items:center;font-size:11px;cursor:pointer}
input.ed[type=checkbox]{width:auto;min-width:0}
.idlogo{width:100%;max-width:420px;border-radius:8px;display:block;margin-bottom:8px}
td.dc{position:sticky;right:0;background:var(--card);box-shadow:-8px 0 8px -8px #0004}th.dc{right:0;z-index:2}
</style>

const GUIDE=[['Principes généraux',['<b>Cellules jaunes</b> : à saisir par vous. Cellules blanches : calculées automatiquement, tout se met à jour dès qu’une valeur change.','Chaque tableau a une <b>recherche</b>, des <b>filtres</b> et un tri (clic sur un titre de colonne). « + Ajouter une ligne » crée une ligne, ✕ la supprime.','<b>Enregistrer</b> (en haut) télécharge une nouvelle copie du fichier contenant toutes vos données : remplacez l’ancien fichier par celle-ci. Entre-temps, vos saisies sont aussi gardées dans le navigateur de cet ordinateur.','<b>Réinitialiser</b> efface vos modifications et revient aux données d’origine (les mots de passe sont conservés ; celui du Tableau de bord est demandé). <b>Thème</b> : clair ou sombre.']],
['Accès protégé par mot de passe',['Pages protégées (🔒) : Tableau de bord, Articles, Clôtures journalières, Staff et RH&amp;RM. Les autres pages restent libres.','<b>Chaque page a son propre verrou</b> : en déverrouiller une n’ouvre pas les autres. Au premier accès à une page, vous définissez son mot de passe (4 caractères minimum) ; vous pouvez choisir le même pour plusieurs pages ou des mots de passe différents.','Une page déverrouillée le reste jusqu’à la fermeture ou au rechargement du fichier. Le bouton <b>Mot de passe</b> (en haut) permet de changer celui d’une page : l’ancien est demandé s’il existe.','Un mot de passe oublié ne peut pas être récupéré. Le verrou limite l’accès à l’écran ; il ne chiffre pas le contenu du fichier : gardez le fichier lui-même en lieu sûr.']],
['Articles 🔒',['Cellules jaunes : code, catégorie, unité, prix de gros (par carton), prix d’entrée (prix d’achat), prix de détail, stock initial, seuil carton et seuil d’alerte.','Le stock actuel, la valeur du stock, la marge unitaire et le statut se calculent seuls. Une ligne rouge signale un article sous son seuil d’alerte.','La liste est classée par ordre alphabétique. « + Ajouter une ligne » demande le nom du nouvel article : il prend sa place alphabétique, avec un code provisoire (NEW…) à modifier. Gardez des codes uniques.','Le bouton ✕ supprime un article enregistré après confirmation : si des entrées ou sorties portent son nom, elles restent dans les journaux mais ne comptent plus dans un stock.']],
['Entrées et Sorties',['Saisissez la date, puis la désignation (choisissez dans les suggestions) : le code et la catégorie se remplissent seuls. Une nouvelle ligne reprend la date de la ligne précédente.','Choisissez le Type (Gros ou Détail) : prix unitaire, montant et quantité en unités se calculent seuls. Le détail est converti en équivalent gros d’après le « Seuil carton » de l’article.','Le stock de la page Articles suit automatiquement chaque entrée, vente ou avarie.','<b>Sorties</b> : motif « Vente » (facturée) ou « Avarie » (prix 0 F, mais quantité déduite du stock). Paiement : « Payé », « Crédit » (indiquez le client) ou « N/A ». Reliquat : montant à récupérer, puis statut Récupéré / Non récupéré (idem sur Entrées, avec le fournisseur).']],
['Commande (factures)',['« + Nouvelle facture » : le numéro (IMP-0001, IMP-0002…) est attribué automatiquement ; la date et l’heure sont celles de la validation.','Saisissez client et caissier, puis pour chaque ligne le <b>code article</b>, le type (Gros/Détail) et la quantité : la référence, le prix unitaire et le montant se remplissent seuls, et le total s’affiche en bas. Indiquez Payé comptant / Non payé et Livré / Non livré.','« Valider la facture » l’enregistre dans l’une des 4 catégories : payées et livrées, payées et non livrées, livrées à crédit, non payées et non livrées. Cliquez sur un numéro pour la revoir, la télécharger en <b>JPG</b> ou <b>PDF</b>, ou la marquer payée / livrée (elle change alors de catégorie).','Les prix d’une facture validée sont figés. Les numéros ne sont jamais réutilisés. Les factures ne modifient pas le stock : enregistrez les sorties correspondantes dans Sorties.']],
['Caisse',['Dettes clients : les ventes à crédit de Sorties sont reprises automatiquement ; saisissez seulement le montant payé et la date de paiement.','Reliquats : repris des pages Entrées et Sorties (le statut se change à la source). Sorties de caisse : espèces retirées, à saisir à chaque retrait (date, bénéficiaire, montant, motif).']],
['Clôtures journalières 🔒 et Tableau de bord 🔒',['Clôtures : ajoutez une ligne par journée (la date suivante est proposée). Quantités, chiffre d’affaires du jour et cumulé, dettes, reliquats, espèces et avaries se calculent seuls. Le statut Ouverte / Clôturée est facultatif.','Tableau de bord : indicateurs, synthèse par catégorie, CA par journée, récapitulatif de la dernière journée enregistrée et inventaire par article à la date de votre choix.']],
['Staff 🔒',['Un employé par ligne : état civil (nom, prénoms, sexe, naissance, situation matrimoniale), niveau d’études, poste, date de recrutement, salaire, date de paiement, jours de travail (cases L à D), période (matin, soir, temps plein) et observations.','Le <b>code employé</b> est généré à l’ajout : trois premières lettres du poste + IMP + numéro (ex. CAI-IMP-01). Il ne change plus ensuite.']],
['RH&amp;RM 🔒',['<b>Ressource humaine</b> : enregistrez dans le journal chaque action (retard, absence justifiée ou non, manquant, prime, comportement, démission) avec le code de l’employé.','Règles : retard = amende de 500 F ; absence justifiée = aucune amende ; absence non justifiée et manquant = montant saisi, compté comme amende ; <b>total salaire = salaire de base + primes − amendes</b>. Le tableau du mois (choisissez le mois) affiche assiduité, ponctualité, amendes, primes, total salaire ; vous réglez le statut du salaire Payé / Non payé.','<b>Ressource matérielle</b> : entrées et sorties de matériel (nom, date, auteur, montant, état). Le code est généré à l’ajout (3 premières lettres du nom + numéro, ex. TAB-01) ; un même nom garde le même code.']],
['Compte, abonnement et administration (version en ligne)',['Créez votre compte (état civil, e-mail, mot de passe, formule) : un code de vérification à 6 chiffres est envoyé à votre e-mail ; saisissez-le pour activer le compte. La connexion dure 24 heures, puis il faut se reconnecter.','Chaque abonné dispose de son propre espace de données, invisible des autres abonnés. Les données sont enregistrées en ligne et synchronisées sur tous vos appareils.','Abonnement : choisissez la formule (mensuelle 1 500 F, trimestrielle 4 000 F, semestrielle 7 500 F, annuelle 16 000 F), payez par MTN Mobile Money ou Orange Money, puis déclarez votre paiement avec la référence de la transaction. L’administrateur le vérifie et active l’abonnement : l’application se débloque alors toute seule. Sans abonnement actif, seul l’onglet Abonnement est accessible.','Administrateur : l’onglet Administration affiche le tableau de bord (abonnés, revenus, formules), les paiements à valider et la gestion des abonnements (activer, prolonger, suspendre).']],
['Code couleur et remarques',['Rouge : avarie, dette, reliquat non soldé, statut d’alerte. Vert : payé, récupéré, clôturé, en poste. Orange : crédit, journée ouverte, non livré.','Les catégories d’articles sont indicatives : modifiables à tout moment sur la page Articles, les totaux s’ajustent seuls.']]];

grid($('#adm-pay'),[{i:0,h:'Date',f:v=>new Date(v).toLocaleString('fr-FR')},{i:1,h:'Abonné'},{i:2,h:'E-mail'},{i:3,h:'Formule'},{i:4,h:'Montant',n:1,f:M,sum:1,sf:M},{i:5,h:'Opérateur'},{i:6,h:'N° payeur'},{i:7,h:'Référence'},{i:8,h:'Statut',f:PB},{i:10,h:'Action',f:(v,x)=>x[8]==='declare'?`<button class="btn" data-adm="ok" data-id="${x[9]}" type="button">Valider</button> <button class="btn alt" data-adm="no" data-id="${x[9]}" type="button">Rejeter</button>`:''}],()=>PAYS.map(p=>[p.creeMs,p.nom,p.email,(PLANS[p.plan]||{}).n,p.montant,p.operateur,p.numero,p.reference,p.statut,p.id,'']),{filters:[{i:8,label:'Statut'}]});
grid($('#adm-ab'),[{i:0,h:'Abonné'},{i:1,h:'E-mail'},{i:2,h:'Formule'},{i:3,h:'Statut',f:v=>`<span class="b ${v==='Actif'?'ok':v==='Aucun'?'warn':'bad'}">${v}</span>`},{i:4,h:'Fin',f:dd},{i:5,h:'Jours restants',n:1},{i:7,h:'Actions',f:(v,x)=>`<button class="btn" data-adm="ext" data-uid="${x[6]}" type="button">Activer / prolonger</button> `+(x[3]==='Actif'?`<button class="btn alt" data-adm="sus" data-uid="${x[6]}" type="button">Suspendre</button>`:x[3]==='Suspendu'?`<button class="btn alt" data-adm="rea" data-uid="${x[6]}" type="button">Réactiver</button>`:'')}],()=>Object.keys(PROFILES).filter(u=>(PROFILES[u].email||'').toLowerCase()!==ADMIN).map(u=>{const p=PROFILES[u],s=SUBS[u],pk=(s&&s.plan)||p.planDemande;return[((p.pn||'')+' '+(p.nom||'')).trim(),p.email,PLANS[pk]?PLANS[pk].n:'',subState(u),s?s.fin:'',s&&s.finMs>Date.now()?Math.ceil((s.finMs-Date.now())/864e5):'',u,'']}),{filters:[{i:3,label:'Statut'},{i:2,label:'Formule'}]});
function startAdmin(){const sub=(name,fn)=>{const u=live(name,()=>SB.from(name).select('*'),r=>{fn(r.data||[]);renderAdmin();G.forEach(g=>g.draw())});ADMRUN.push(u);UNSUBA.push(u)};
 sub('profiles',rows=>{PROFILES={};rows.forEach(r=>{PROFILES[r.id]=mapProf(r)})});sub('abonnements',rows=>{SUBS={};rows.forEach(r=>{SUBS[r.user_id]=mapSub(r)})});sub('paiements',rows=>{PAYS=rows.map(mapPay).sort((a,b)=>b.creeMs-a.creeMs)})}
async function rpc(name,args){const{data,error}=await SB.rpc(name,args);if(error)throw error;ADMRUN.forEach(u=>u.run());return data}
$('#s-admin').addEventListener('click',async e=>{const b=e.target.closest('[data-adm]');if(!b)return;const k=b.dataset.adm,id=b.dataset.id,uid=b.dataset.uid;
 try{if(k==='ok'){const p=PAYS.find(x=>x.id===id);if(!p)return;if(!(await uiConfirm('Valider le paiement de '+p.nom+' ('+nf.format(p.montant)+' F, réf. '+p.reference+') et activer la formule '+PLANS[p.plan].n+' ?')))return;await rpc('admin_activer',{p_user:p.uid,p_plan:p.plan,p_paiement:id})}
 else if(k==='no'){if(!(await uiConfirm('Rejeter cette déclaration de paiement ?')))return;await rpc('admin_rejeter',{p_paiement:id})}
 else if(k==='ext'){const pl=((await uiPrompt('Formule à activer : M (mensuelle), T (trimestrielle), S (semestrielle) ou A (annuelle) ?'))||'').trim().toUpperCase();if(!PLANS[pl])return;await rpc('admin_activer',{p_user:uid,p_plan:pl,p_paiement:null})}
 else if(k==='sus'||k==='rea'){await rpc('admin_statut',{p_user:uid,p_statut:k==='sus'?'suspendu':'actif'})}}
 catch(er){uiAlert('Action impossible : '+(er.message||er.code))}});
/* ---------- base vide : démarrage ---------- */
function tryReady(){if(READY)return;
 if(remote.size>0){rebuild();READY=true;$('#dbbar').innerHTML='';setSync('ok');refresh();return}
 if(IS_ADMIN){$('#dbbar').innerHTML=`<div class="card" style="margin-bottom:14px"><b>Votre espace de données est vide.</b><p class="note">Importez le fichier de données initial (donnees_cave_initiales.json) ou commencez avec une base vide.</p><p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="file" id="dbfile" accept=".json,application/json"><button class="btn alt" id="dbempty" type="button">Commencer avec une base vide</button></p></div>`;setSync('ok');return}
 S=blankS();READY=true;setSync('ok');refresh()}
document.addEventListener('change',e=>{if(e.target.id==='dbfile'&&e.target.files[0]){e.target.files[0].text().then(t=>{try{S=Object.assign(blankS(),JSON.parse(t));READY=true;$('#dbbar').innerHTML='';setSync('wait');save();refresh()}catch(er){uiAlert('Fichier illisible : choisissez donnees_cave_initiales.json.')}})}});
document.addEventListener('click',e=>{if(e.target.id==='dbempty'){S=blankS();READY=true;$('#dbbar').innerHTML='';setSync('ok');refresh()}});
/* ---------- initialisation Supabase ---------- */
async function cloudInit(){if(!SBC.url||!SBC.anonKey||/COLLER/i.test(SBC.url+SBC.anonKey)){authUI('config');return}
 authUI('wait');let M_;try{M_=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm')}catch(e){authUI('login','Impossible de charger le service : vérifiez votre connexion internet.');return}
 SB=M_.createClient(SBC.url,SBC.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 SB.auth.onAuthStateChange((ev,ses)=>{if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;if(ev==='PASSWORD_RECOVERY'){RECOVERING=true;return}if(RECOVERING&&ses)return;
  const u=ses&&ses.user;if(u&&USER&&u.id===USER.id&&AUTHED){USER=u;return}setTimeout(()=>onAuth(u||null),0)})}

function refresh(){calc();$('#ds').innerHTML=S.staff.map(x=>`<option value="${esc(x.c)}">${esc(x.nom+' '+x.pn)}</option>`).join('');dash();caisse();cmd();$('#dc').innerHTML=S.articles.map(a=>`<option value="${esc(a.c)}">${esc(a.n)}</option>`).join('');$('#du').innerHTML=[...new Set(S.articles.map(a=>a.u).filter(Boolean))].sort().map(n=>`<option value="${esc(n)}">`).join('');$('#dl').innerHTML=[...S.articles].map(a=>a.n).sort((a,b)=>a.localeCompare(b,'fr')).map(n=>`<option value="${esc(n)}">`).join('');G.forEach(g=>g.draw())}
(function(){calc();refresh();const h0=location.hash.slice(1).replace(/[^a-z]/g,'');show(NAV.some(n=>n[0]===h0)?h0:'cmd')})();
cloudInit();
</script>
