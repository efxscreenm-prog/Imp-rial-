<script>
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const D={"guide":["Gestion de stock de cave Imperiale — Mode d'emploi","COMPOSITION DU CLASSEUR","• Tableau de bord : indicateurs clés, graphiques, récapitulatif de la dernière clôture et","  inventaire journalier par article — tout est automatique.","• Articles : fiche de référence des 143 produits (code, catégorie, prix, stock, alertes).","• Entrées : journal des entrées de stock (achats, réapprovisionnements).","• Sorties : journal des sorties de stock (ventes en gros ou au détail, avaries).","• Caisse : dettes clients (crédit), reliquats à récupérer et sorties d'espèces.","• Clôtures Journalières : un journal, une ligne par jour, avec cumul progressif du CA.","COMMENT UTILISER LE CLASSEUR","1. Feuille Articles : renseignez le Prix de gros, le Prix de détail, le Stock initial et le","   Seuil d'alerte de chaque article (cellules jaunes). Les autres colonnes se calculent seules.","2. Pour une entrée ou une sortie : allez sur la feuille correspondante, choisissez la Date,","   puis sélectionnez le nom du produit dans la liste déroulante de la colonne « Désignation »","   (produits triés par ordre alphabétique). Le Code et la Catégorie se remplissent seuls.","3. Choisissez le Type (Gros ou Détail) : le prix unitaire et le montant se calculent seuls.","4. Le stock (feuille Articles, colonne Stock Actuel) se met à jour automatiquement dès","   qu'une entrée ou une sortie est enregistrée, que ce soit une vente en gros, au détail,","   ou une avarie — aucune action manuelle n'est nécessaire.","5. En haut à droite des feuilles Entrées et Sorties : un petit encadré « Totaux du jour »","   récapitule automatiquement les quantités/montants du jour, directement sur la feuille.","CONVERSION AUTOMATIQUE DÉTAIL → GROS (CARTONS/PALETTES)","• Sur les feuilles Entrées et Sorties, dès qu'une ligne en Détail atteint 24 unités pour une","  Bière, ou 6 unités pour les autres catégories, la colonne « Équiv. Gros » ajoute","  automatiquement le nombre de cartons/palettes correspondant (ex : 30 bières au détail = 1","  carton + 6 restantes). Ces seuils sont modifiables en haut de la feuille Tableau de bord.","• Sur la feuille Articles, les colonnes « Entrées/Sorties Gros équiv. » additionnent ces cartons","  convertis aux mouvements déjà enregistrés directement en Gros.","SORTIES : VENTES, AVARIES, CRÉDITS ET RELIQUATS","• Motif « Vente » : sortie normale, facturée au client (choisir Gros ou Détail).","• Motif « Avarie » : produit cassé, périmé ou perdu — le prix passe à 0 F CFA automatiquement","  (aucune recette), mais la quantité est bien déduite du stock.","• Statut Paiement : « Payé » si le client règle immédiatement, « Crédit » si le produit sort","  sans être payé (indiquez alors le nom du client dans« Client / Débiteur »), « N/A » pour","  les avaries. Les ventes à Crédit apparaissent automatiquement dans Caisse > Dettes clients.","• Colonne « Reliquat à récupérer » : montant qu'un client doit venir récupérer (ex. monnaie non","  rendue). Indiquez le montant, puis le Statut « Récupéré » ou « Non récupéré ». Même principe","  sur la feuille Entrées (colonnes Fournisseur/Bénéficiaire puis Reliquat). Ces lignes","  apparaissent automatiquement dans Caisse > Reliquats à récupérer.","• La colonne Observations reste libre pour toute remarque (raison de l'avarie, précisions...).","FEUILLE CAISSE (3 blocs)","• Dettes clients : lignes « Crédit » de la feuille Sorties, reprises automatiquement. Saisissez","  le Montant Payé et la Date de Paiement (cellules jaunes) : le Reste à Payer et le Statut se","  recalculent seuls.","• Reliquats à récupérer : reprend automatiquement les lignes « Reliquat » des feuilles Entrées","  et Sorties — rien à saisir ici, le Statut se modifie directement sur la feuille d'origine.","• Sorties de caisse (espèces) : à remplir manuellement à chaque retrait d'argent liquide","  (Date, Bénéficiaire, Montant, Motif) — utile pour suivre les « dettes entreprise ».","• Les totaux en haut de la feuille (dettes en cours, reliquats n
